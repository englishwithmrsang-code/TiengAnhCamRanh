            const current = input.value.trim();

            input.dispatchEvent(new Event('input'));

                            <div class="text-slate-800"><strong class="text-indigo-700"><i class="fa-solid fa-quote-left text-[10px]"></i> Ví dụ:</strong> ${st.example}</div>
                        </div>

                        <p class="text-sm font-bold text-slate-900 pt-0.5">${st.taskVn}</p>

                        <!-- Gợi ý từ vựng bấm chèn nhanh -->
                        <div class="flex flex-wrap items-center gap-1.5">
                            <span class="text-xs font-semibold text-amber-800 mr-1">
                                <i class="fa-solid fa-lightbulb text-amber-500"></i> Từ vựng gợi ý:
                            </span>
                            ${clickableChips}
                        </div>

                        <!-- Input -->
                        <div class="flex flex-col sm:flex-row gap-2">
                            <input type="text" id="${inputId}" value="${savedVal.replace(/"/g, '&quot;')}" 
                                oninput="saveUserSentence('${topicKey}', '${st.id}', this.value)"
                                placeholder="Nhập câu tiếng Anh của bạn theo cấu trúc trên..." 
                                class="flex-1 px-3.5 py-2 text-sm bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <button type="button" onclick="toggleBox('${topicKey}_${st.id}_ans')" 
                                class="px-3.5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5 shrink-0">
                                <i class="fa-solid fa-key"></i> Đáp án mẫu
                            </button>
                        </div>

                        <!-- Sample Answer -->
                        <div id="${topicKey}_${st.id}_ans" class="hidden text-xs text-emerald-800 bg-emerald-50 p-2.5 rounded-xl border border-emerald-200 font-medium">
                            <strong><i class="fa-solid fa-check-circle"></i> Gợi ý:</strong> ${st.sampleAns}
                        </div>
                    </div>
                `;
            }).join('');

            area.innerHTML = `
                <!-- Section 1: Compact Vocabulary & Collocations Bank -->
                <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-5 space-y-3">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
                        <h2 class="font-bold text-base md:text-lg text-slate-900">${data.title}</h2>
                        <span class="text-xs font-bold bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full">${data.vocabBank.length} từ vựng cốt lõi</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
                        ${vocabCardsHTML}
                    </div>
                </section>

                <!-- Section 2: 10 Key Structures & Sentence Building -->
                <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-5 space-y-4">
                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-2.5">
                        <h3 class="font-bold text-base md:text-lg text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-pen-to-square text-indigo-600"></i> 10 Cấu Trúc Diễn Đạt & Luyện Đặt Câu
                        </h3>
                        <div class="flex items-center gap-2 text-xs">
                            <span class="px-2 py-0.5 rounded bg-indigo-100 text-indigo-800 font-semibold">1–5: Cấu trúc bài học</span>
                            <span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-semibold">6–10: Useful Writing Structures</span>
                        </div>
                    </div>
                    <div class="space-y-3.5">
                        ${structuresHTML}
                    </div>
                </section>
            `;
        }

        window.onload = () => renderTopic('topic1');
    </script>
</body>
</html>
