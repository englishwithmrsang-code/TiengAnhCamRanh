<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr Sang English – Listening Practice</title>
<style>
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1e293b;
  --muted: #64748b;
  --line: #e2e8f0;
  --primary: #4f46e5;
  --primary-soft: #eef2ff;
  --primary-border: #c7d2fe;
  --teal: #0d9488;
  --teal-soft: #f0fdfa;
  --green: #16a34a;
  --green-soft: #f0fdf4;
  --red: #e11d48;
  --red-soft: #fff1f2;
  --radius-xl: 22px;
  --radius-lg: 16px;
  --radius-md: 12px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  line-height: 1.6;
  padding-bottom: 60px;
}

header {
  background: linear-gradient(135deg, #312e81 0%, #4f46e5 55%, #0d9488 100%);
  color: white;
  padding: 22px 18px;
  border-bottom-left-radius: 28px;
  border-bottom-right-radius: 28px;
  box-shadow: 0 8px 24px rgba(79, 70, 229, 0.15);
  margin-bottom: 20px;
}

.wrap { max-width: 1020px; margin: auto; padding: 0 16px; }
h1 { margin: 0; font-size: clamp(21px, 3.2vw, 28px); letter-spacing: -0.3px; }

.main-tabs, .subtabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

button {
  border: 0;
  border-radius: 999px;
  padding: 9px 18px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  background: #e2e8f0;
  color: #334155;
  transition: all 0.2s ease;
}

button:hover { filter: brightness(0.97); transform: translateY(-1px); }
button.active {
  background: var(--primary);
  color: white;
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
}

.subtabs button {
  padding: 7px 16px;
  font-size: 13.5px;
  background: #ffffff;
  border: 1px solid var(--line);
  color: #475569;
}
.subtabs button.active {
  background: var(--teal);
  border-color: var(--teal);
  color: white;
  box-shadow: 0 4px 10px rgba(13, 148, 136, 0.2);
}

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 6px 24px rgba(15, 23, 42, 0.04);
}

h2 { margin: 0 0 12px; color: #1e1b4b; font-size: 19px; }
h3 { margin: 8px 0 6px; color: var(--primary); font-size: 16px; }

/* Rounded Audio Player */
.audio-card {
  background: linear-gradient(135deg, #eef2ff 0%, #f0fdfa 100%);
  border: 1px solid var(--primary-border);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  margin: 10px 0 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.audio-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.audio-btns {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.play-trigger {
  background: var(--teal);
  color: white;
  padding: 8px 18px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 3px 10px rgba(13, 148, 136, 0.25);
}
.play-trigger:hover { background: #0f766e; }
.play-trigger.playing { background: #e11d48; }
.mini-ctrl {
  padding: 6px 11px;
  font-size: 12px;
  border-radius: 999px;
  background: white;
  border: 1px solid #cbd5e1;
  color: #334155;
  font-weight: 600;
}
.mini-ctrl:hover { background: var(--primary-soft); border-color: var(--primary); }
audio {
  flex: 1;
  min-width: 220px;
  height: 36px;
  border-radius: 999px;
  outline: none;
}
.synth-bar {
  display: none;
  align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.85);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  color: #0f766e;
  font-weight: 600;
  border: 1px solid #99f6e4;
}
.synth-bar.active { display: flex; }
.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #0d9488;
  animation: pulse 1s infinite alternate;
}
@keyframes pulse {
  from { opacity: 0.4; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1.2); }
}

/* Questions & Options */
.question {
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}
.question:last-child { border-bottom: 0; }
.qtitle { font-weight: 700; margin-bottom: 10px; color: #1e293b; }
.options { display: grid; gap: 8px; }
.option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.15s ease;
  background: #fcfdff;
}
.option:hover { background: var(--primary-soft); border-color: #a5b4fc; }
.option input { margin: 0; accent-color: var(--primary); transform: scale(1.1); }

input[type=text], select {
  width: 100%;
  max-width: 400px;
  padding: 9px 14px;
  border: 1px solid #cbd5e1;
  border-radius: var(--radius-md);
  font-size: 15px;
  background: #fff;
  transition: all 0.2s;
}
input[type=text]:focus, select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
}

.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.primary { background: var(--primary); color: white; }
.secondary { background: #e2e8f0; color: #334155; }

.result {
  display: none;
  padding: 14px 18px;
  border-radius: var(--radius-lg);
  margin-top: 16px;
  background: var(--primary-soft);
  border: 1px solid var(--primary-border);
}
.result.show { display: block; }
.good { color: var(--green); font-weight: 600; margin: 3px 0; }
.bad { color: var(--red); font-weight: 600; margin: 3px 0; }

/* Transcript Gap-fill */
.transcript { font-size: 15.5px; line-height: 2.25; }
.blank {
  display: inline-block;
  width: 135px;
  max-width: 40vw;
  padding: 4px 10px;
  margin: 0 4px;
  border: 1px solid #a5b4fc;
  border-radius: 10px;
  font-size: 14.5px;
  background: var(--primary-soft);
  text-align: center;
  font-weight: 600;
  color: #312e81;
}
.blank.correct { border: 2px solid var(--green); background: var(--green-soft); color: var(--green); }
.blank.wrong { border: 2px solid var(--red); background: var(--red-soft); color: var(--red); }
.transcript p { margin: 8px 0; }
.speaker { font-weight: 700; color: var(--primary); }

.image-options { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.image-options img {
  max-width: 100%;
  width: 240px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
}

/* Vocabulary Cards (Tab 3) */
.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 12px;
  margin-top: 10px;
}
.vocab-card {
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 13px 15px;
  transition: all 0.2s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.vocab-card:hover {
  border-color: #a5b4fc;
  background: #fafbff;
  transform: translateY(-2px);
}
.vocab-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.vocab-word { font-weight: 700; font-size: 15.5px; color: #312e81; }
.vocab-pos {
  font-size: 11px;
  font-weight: 700;
  background: var(--teal-soft);
  color: var(--teal);
  padding: 2px 8px;
  border-radius: 999px;
  margin-left: 5px;
}
.vocab-ipa {
  font-size: 13px;
  color: var(--muted);
  font-family: 'Lucida Sans Unicode', Arial, sans-serif;
  margin: 2px 0 5px;
}
.vocab-vn { font-weight: 700; color: #0f766e; font-size: 14px; margin-bottom: 6px; }
.vocab-ex {
  font-size: 13px;
  color: #475569;
  background: #f8fafc;
  padding: 6px 10px;
  border-radius: 9px;
  border-left: 3px solid var(--primary);
  font-style: italic;
}
.speak-btn {
  background: var(--primary-soft);
  color: var(--primary);
  border: 0;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  cursor: pointer;
  flex-shrink: 0;
}
.speak-btn:hover { background: var(--primary); color: white; }

.hidden { display: none !important; }

/* Small Unobtrusive Corner Tracker */
.corner-tracker {
  position: fixed;
  bottom: 12px;
  right: 12px;
  z-index: 9999;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(8px);
  border: 1px solid #cbd5e1;
  border-radius: 16px;
  padding: 6px 12px;
  box-shadow: 0 6px 20px rgba(15, 23, 42, 0.1);
  font-size: 11.5px;
  color: #1e293b;
  transition: all 0.2s ease;
  max-width: 220px;
}
.corner-tracker.minimized { border-radius: 999px; }
.tracker-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  cursor: pointer;
  font-weight: 700;
}
.tracker-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--teal);
  display: inline-block;
}
.tracker-body {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid var(--line);
  display: grid;
  gap: 3px;
}
.corner-tracker.minimized .tracker-body { display: none; }
.tracker-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 11px;
}
.tracker-badge {
  background: #f1f5f9;
  padding: 1px 6px;
  border-radius: 6px;
  font-weight: 600;
  color: #475569;
}
.tracker-badge.done { background: #ccfbf1; color: #0f766e; }

@media(max-width: 600px) {
  .panel { padding: 15px; border-radius: 16px; }
  .blank { width: 110px; }
  .image-options img { width: 100%; }
}
</style>
</head>

    { w: "open for business", pos: "adj.p", ipa: "/ˈəʊpən fɔː ˈbɪznɪs/", vn: "mở cửa hoạt động kinh doanh", ex: "We will be open for business on 21st May." },
    { w: "exciting holiday", pos: "n.p", ipa: "/ɪkˈsaɪtɪŋ ˈhɒlɪdeɪ/", vn: "kỳ nghỉ thú vị, hấp dẫn", ex: "We have many exciting holidays at special prices." },
    { w: "special price", pos: "n.p", ipa: "/ˈspɛʃl praɪs/", vn: "mức giá ưu đãi đặc biệt", ex: "We have many exciting holidays at special prices." },
    { w: "present", pos: "n", ipa: "/ˈprɛznt/", vn: "món quà tặng", ex: "And we have a present for anyone who spends £350." },
    { w: "spend money on", pos: "v.p", ipa: "/spɛnd ˈmʌni ɒn/", vn: "chi tiêu tiền vào việc gì", ex: "Anyone who spends £350 or more on a holiday." },
    { w: "absolutely free", pos: "adj.p", ipa: "/ˌæbsəˈluːtli friː/", vn: "hoàn toàn miễn phí", ex: "We will give you a travel bag absolutely free." },
    { w: "plane journey", pos: "n.p", ipa: "/pleɪn ˈdʒɜːni/", vn: "chuyến đi bằng máy bay", ex: "Carry everything you need on a plane journey." }
  ]
};

let currentTest = 1, currentTranscript = 1, currentVocab = 1;
let currentSpeechRate = 0.95;
let isSynthPlaying = false;
let synthLineIndex = 0;
let activeSynthPart = null;
let activeSynthBarId = null;

function audioMarkup(mode, part) {
  const playerId = `player-${mode}-${part}`;
  const btnId = `playbtn-${mode}-${part}`;
  const barId = `synthbar-${mode}-${part}`;
  const firstSrc = audioCandidates[part][0];

  return `
  <div class="audio-card">
    <div class="audio-row">
      <div class="audio-btns">
        <button type="button" id="${btnId}" class="play-trigger" onclick="smartPlay('${playerId}', ${part}, '${btnId}', '${barId}')">▶ Play</button>
        <button type="button" class="mini-ctrl" onclick="seekAudio('${playerId}', ${part}, -5)">-5s</button>
        <button type="button" class="mini-ctrl" onclick="seekAudio('${playerId}', ${part}, 5)">+5s</button>
        <button type="button" class="mini-ctrl" onclick="cycleSpeed('${playerId}', this)">1.0x</button>
        <button type="button" class="mini-ctrl" onclick="stopAllAudio('${playerId}', '${btnId}', '${barId}')">⏹</button>
      </div>
      <audio id="${playerId}" controls preload="metadata" src="${firstSrc}" data-part="${part}" data-try="0" onerror="tryNextAudioSource(this, '${btnId}', '${barId}')"></audio>
    </div>
    <div id="${barId}" class="synth-bar">
      <span class="pulse-dot"></span>
      <span id="${barId}-text">Playing Part ${part} audio...</span>
    </div>
  </div>`;
}

// Automatically steps through encoded filename -> plain filename -> 0.mp3 -> Built-in Speech
function tryNextAudioSource(audioEl, btnId, barId) {
  const part = +audioEl.dataset.part;
  let tryIdx = (+audioEl.dataset.try || 0) + 1;
  const list = audioCandidates[part];

  if (tryIdx < list.length) {
    audioEl.dataset.try = tryIdx;
    audioEl.src = list[tryIdx];
  } else {
    audioEl.dataset.fallback = "synth";
  }
}

function smartPlay(playerId, part, btnId, barId) {
  const player = document.getElementById(playerId);
  const btn = document.getElementById(btnId);

  // If already playing synth, pause/stop it
  if (isSynthPlaying && activeSynthPart === part) {
    stopAllAudio(playerId, btnId, barId);
    return;
  }

  // If HTML5 player is currently playing, pause it
  if (player && !player.paused) {
    player.pause();
    if (btn) { btn.textContent = "▶ Play"; btn.classList.remove("playing"); }
    return;
  }

  stopAllAudio(playerId, btnId, barId);

  if (player && player.dataset.fallback !== "synth") {
    const p = player.play();
    if (p !== undefined) {
      p.then(() => {
        if (btn) { btn.textContent = "⏸ Pause"; btn.classList.add("playing"); }
      }).catch(() => {
        startSynthPlayback(part, btnId, barId);
      });
    }
  } else {
    startSynthPlayback(part, btnId, barId);
  }
}

function startSynthPlayback(part, btnId, barId, startIndex = 0) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();

  isSynthPlaying = true;
  activeSynthPart = part;
  activeSynthBarId = barId;
  synthLineIndex = startIndex;

  const btn = document.getElementById(btnId);
  const bar = document.getElementById(barId);
  const barText = document.getElementById(`${barId}-text`);

  if (btn) { btn.textContent = "⏹ Stop"; btn.classList.add("playing"); }
  if (bar) bar.classList.add("active");

  const lines = fullExamScripts[part];
  const voices = window.speechSynthesis.getVoices();
  const enVoices = voices.filter(v => v.lang.startsWith("en"));

  function speakCurrentLine() {
    if (!isSynthPlaying || synthLineIndex >= lines.length) {
      isSynthPlaying = false;
      if (btn) { btn.textContent = "▶ Play"; btn.classList.remove("playing"); }
      if (bar) bar.classList.remove("active");
      return;
    }

    const [speaker, text] = lines[synthLineIndex];
    if (barText) barText.textContent = `Playing (${synthLineIndex + 1}/${lines.length})...`;

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-GB";
    utter.rate = currentSpeechRate;

    if (speaker === "Male") {
      utter.pitch = 0.85;
      if (enVoices[0]) utter.voice = enVoices[0];
    } else if (speaker === "Female") {
      utter.pitch = 1.15;
      if (enVoices[1]) utter.voice = enVoices[1];
    } else {
      utter.pitch = 1.0;
    }

    utter.onend = () => {
      if (!isSynthPlaying) return;
      synthLineIndex++;
      setTimeout(speakCurrentLine, 280);
    };

    utter.onerror = () => {
      if (!isSynthPlaying) return;
      synthLineIndex++;
      speakCurrentLine();
    };

    window.speechSynthesis.speak(utter);
  }

  speakCurrentLine();
}

function stopAllAudio(playerId, btnId, barId) {
  isSynthPlaying = false;
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();

  const player = document.getElementById(playerId);
  if (player) {
    try { player.pause(); player.currentTime = 0; } catch(e) {}
  }

  document.querySelectorAll(".play-trigger").forEach(b => {
    b.textContent = "▶ Play";
    b.classList.remove("playing");
  });
  document.querySelectorAll(".synth-bar").forEach(b => b.classList.remove("active"));
}

function seekAudio(playerId, part, delta) {
  const player = document.getElementById(playerId);
  if (isSynthPlaying && activeSynthPart === part) {
    const step = delta > 0 ? 2 : -2;
    const nextIdx = Math.max(0, Math.min(fullExamScripts[part].length - 1, synthLineIndex + step));
    const btnId = playerId.replace("player-", "playbtn-");
    const barId = playerId.replace("player-", "synthbar-");
    startSynthPlayback(part, btnId, barId, nextIdx);
    return;
  }
  if (player && player.duration) {
    player.currentTime = Math.max(0, Math.min(player.duration, player.currentTime + delta));
  }
}

function cycleSpeed(playerId, btn) {
  const speeds = [1.0, 0.85, 0.75, 1.15];
  const player = document.getElementById(playerId);
  let idx = speeds.indexOf(currentSpeechRate);
  idx = (idx + 1) % speeds.length;
  currentSpeechRate = speeds[idx];
  if (player) player.playbackRate = currentSpeechRate;
  btn.textContent = currentSpeechRate + "x";
}

function speakWord(word) {
  if (!('speechSynthesis' in window)) return;
  isSynthPlaying = false;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = "en-GB";
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}

function saveCurrentTestInputs(part) {
  const form = document.getElementById("testForm");
  if (!form) return;
  const d = parts[part];
  d.questions.forEach(q => {
    const el = form.elements[String(q.n)];
    if (!el) return;
    if (el.length && el[0] && el[0].type === "radio") {
      const checked = form.querySelector(`input[name="${q.n}"]:checked`);
      trackerState.savedTestInputs[part][q.n] = checked ? checked.value : "";
    } else {
      trackerState.savedTestInputs[part][q.n] = el.value;
    }
  });
}

function renderTest(part) {
  stopAllAudio();
  currentTest = part;
  const d = parts[part];
  const saved = trackerState.savedTestInputs[part] || {};
  let html = `<h2>${d.title}</h2>${audioMarkup('test', part)}<form id="testForm" oninput="saveCurrentTestInputs(${part})">`;

  if (part === 2) {
    html += `<p style="background:#f8fafc;padding:10px 14px;border-radius:12px;border:1px solid #e2e8f0;font-size:14px;"><b>Jobs:</b> A bank clerk · B doctor · C farmer · D shop assistant · E stopped work · F student · G teacher · H writer</p>`;
  }

  d.questions.forEach(q => {
    const val = saved[q.n] || "";
    html += `<div class="question"><div class="qtitle">${q.n}. ${q.q}</div>`;
    if (q.img) html += `<div class="image-options"><a href="${q.img}" target="_blank" rel="noopener"><img src="${q.img}" alt="Question ${q.n}"></a></div>`;
    if (q.type === "text") {
      html += `<input type="text" name="${q.n}" value="${val.replace(/"/g, '&quot;')}" placeholder="${q.placeholder || 'Your answer'}" autocomplete="off">`;
    } else if (q.type === "select") {
      html += `<select name="${q.n}"><option value="">Choose a job</option>${q.opts.map(o => `<option value="${o.charAt(0)}" ${val === o.charAt(0) ? 'selected' : ''}>${o}</option>`).join("")}</select>`;
    } else {
      html += `<div class="options">${q.opts.map((o, i) => {
        const letter = "ABC"[i];
        return `<label class="option"><input type="radio" name="${q.n}" value="${letter}" ${val === letter ? 'checked' : ''}><span>${o}</span></label>`;
      }).join("")}</div>`;
    }
    html += `</div>`;
  });

  html += `</form><div class="actions"><button class="primary" onclick="submitTest(${part})" type="button">Submit</button><button class="secondary" onclick="resetTest(${part})" type="button">Reset</button></div><div id="testResult" class="result"></div>`;
  document.getElementById("testPartContent").innerHTML = html;
  document.querySelectorAll("#testTabs button").forEach(b => b.classList.toggle("active", +b.dataset.part === part));
}

function normalize(s) {
  return (s || "").toLowerCase().trim().replace(/[.,!?']/g, "").replace(/\s+/g, " ");
}

function submitTest(part) {
  saveCurrentTestInputs(part);
  const d = parts[part];
  let score = 0, details = [];
  d.questions.forEach(q => {
    const val = trackerState.savedTestInputs[part][q.n] || "";
    const correct = answerKeys[part][q.n];
    let ok;
    if (part <= 3) {
      ok = normalize(val) === normalize(correct);
    } else {
      let v = normalize(val), c = normalize(correct);
      if (q.n === 18) ok = ["830 pm", "8.30 pm", "2030", "20.30", "half past eight", "8 30", "8 30 pm", "830"].includes(v);
      else if (q.n === 17) ok = ["grand hotel", "the grand hotel"].includes(v);
      else if (q.n === 24) ok = ["350", "£350", "350 pounds"].includes(v);
      else if (q.n === 25) ok = ["travel bag", "a travel bag"].includes(v);
      else if (q.n === 22) ok = ["bank", "the bank"].includes(v);
      else if (q.n === 23) ok = ["21st may", "21 may", "the 21st of may", "may 21st"].includes(v);
      else if (q.n === 20) ok = v.replace(/\D/g, "") === "7245936";
      else ok = v === c;
    }
    if (ok) score++;
    details.push(`<div class="${ok ? 'good' : 'bad'}">${q.n}. ${ok ? '✓ Correct' : '✗ Incorrect'} · Answer: <b>${correct}</b></div>`);
  });

  trackerState.testScores[part] = score;
  updateTrackerUI();

  const result = document.getElementById("testResult");
  result.className = "result show";
  result.innerHTML = `<h3>Score: ${score}/${d.questions.length}</h3>${details.join("")}`;
}

function resetTest(part) {
  trackerState.savedTestInputs[part] = {};
  trackerState.testScores[part] = null;
  updateTrackerUI();
  renderTest(part);
}

function saveCurrentTranscriptInputs(part) {
  const inputs = [...document.querySelectorAll("#transcriptForm .blank")];
  inputs.forEach((inp, idx) => {
    trackerState.savedTransInputs[part][idx + 1] = inp.value;
  });
}

function renderTranscript(part) {
  stopAllAudio();
  currentTranscript = part;
  const d = parts[part];
  const saved = trackerState.savedTransInputs[part] || {};
  let blanks = 0;
  let html = `<h2>${d.title} · Transcript</h2>${audioMarkup('transcript', part)}<form id="transcriptForm" class="transcript" oninput="saveCurrentTranscriptInputs(${part})">`;

  d.transcript.forEach(line => {
    const [speaker, ...segments] = line;
    html += `<p><span class="speaker">${speaker}:</span> `;
    segments.forEach(seg => {
      if (Array.isArray(seg)) {
        blanks++;
        const savedVal = saved[blanks] || "";
        html += `<input class="blank" type="text" name="blank${blanks}" value="${savedVal.replace(/"/g, '&quot;')}" data-answer="${seg[0].replace(/&/g, '&amp;').replace(/"/g, '&quot;')}" placeholder="(${blanks})">`;
      } else {
        html += seg;
      }
    });
    html += `</p>`;
  });

  html += `</form><div class="actions"><button class="primary" onclick="submitTranscript(${part})" type="button">Submit</button><button class="secondary" onclick="resetTranscript(${part})" type="button">Reset</button><button class="secondary" onclick="showTranscriptAnswers(${part})" type="button">Show answers</button></div><div id="transcriptResult" class="result"></div>`;
  document.getElementById("transcriptPartContent").innerHTML = html;
  document.querySelectorAll("#transcriptTabs button").forEach(b => b.classList.toggle("active", +b.dataset.part === part));
}

function submitTranscript(part) {
  saveCurrentTranscriptInputs(part);
  const inputs = [...document.querySelectorAll("#transcriptForm .blank")];
  let score = 0;
  inputs.forEach(i => {
    const ok = normalize(i.value) === normalize(i.dataset.answer);
    i.classList.toggle("correct", ok);
    i.classList.toggle("wrong", !ok);
    if (ok) score++;
  });

  trackerState.transScores[part] = { score, total: inputs.length };
  updateTrackerUI();

  const r = document.getElementById("transcriptResult");
  r.className = "result show";
  r.innerHTML = `<h3>Score: ${score}/${inputs.length}</h3>`;
}

function resetTranscript(part) {
  trackerState.savedTransInputs[part] = {};
  trackerState.transScores[part] = null;
  updateTrackerUI();
  renderTranscript(part);
}

function showTranscriptAnswers(part) {
  const inputs = [...document.querySelectorAll("#transcriptForm .blank")];
  inputs.forEach((i, idx) => {
    i.value = i.dataset.answer;
    i.classList.remove("wrong");
    i.classList.add("correct");
    trackerState.savedTransInputs[part][idx + 1] = i.value;
  });
}

function renderVocab(part) {
  currentVocab = part;
  const list = vocabularyData[part];
  let html = `<h2>Part ${part} · Vocabulary (${list.length})</h2><div class="vocab-grid">`;

  list.forEach((item, idx) => {
    const cleanWord = item.w.split("–")[0].replace(/\.\.\./g, "").trim().replace(/'/g, "\\'");
    html += `
      <div class="vocab-card">
        <div>
          <div class="vocab-top">
            <div>
              <span class="vocab-word">${idx + 1}. ${item.w}</span>
              <span class="vocab-pos">${item.pos}</span>
            </div>
            <button type="button" class="speak-btn" onclick="speakWord('${cleanWord}')">🔊</button>
          </div>
          <div class="vocab-ipa">${item.ipa}</div>
          <div class="vocab-vn">${item.vn}</div>
        </div>
        <div class="vocab-ex">“${item.ex}”</div>
      </div>
    `;
  });

  html += `</div>`;
  document.getElementById("vocabPartContent").innerHTML = html;
  document.querySelectorAll("#vocabTabs button").forEach(b => b.classList.toggle("active", +b.dataset.part === part));
}

function toggleTracker() {
  const el = document.getElementById("cornerTracker");
  const icon = document.getElementById("trackerToggleIcon");
  el.classList.toggle("minimized");
  icon.textContent = el.classList.contains("minimized") ? "▴" : "▾";
}

function updateTrackerUI() {
  let totalEarned = 0;
  let totalPossible = 25;
  let rowsHtml = "";

  for (let p = 1; p <= 5; p++) {
    const tScore = trackerState.testScores[p];
    const trObj = trackerState.transScores[p];
    const pBlanks = parts[p].transcript.reduce((acc, line) => acc + line.slice(1).filter(Array.isArray).length, 0);
    totalPossible += pBlanks;

    if (tScore !== null) totalEarned += tScore;
    if (trObj !== null) totalEarned += trObj.score;

    const tText = tScore !== null ? `${tScore}/5` : `-`;
    const trText = trObj !== null ? `${trObj.score}/${trObj.total}` : `-`;
    const isDone = tScore !== null && trObj !== null;

    rowsHtml += `
      <div class="tracker-row">
        <span>Part ${p}</span>
        <span class="tracker-badge ${isDone ? 'done' : ''}">T: ${tText} · G: ${trText}</span>
      </div>`;
  }

  document.getElementById("trackerSummary").textContent = `${totalEarned}/${totalPossible}`;
  document.getElementById("trackerDetails").innerHTML = rowsHtml;
}

document.querySelectorAll(".main-tabs button").forEach(b => b.addEventListener("click", () => {
  stopAllAudio();
  document.querySelectorAll(".main-tabs button").forEach(x => x.classList.toggle("active", x === b));
  document.querySelectorAll(".main-content").forEach(x => x.classList.toggle("hidden", x.id !== b.dataset.main));
}));

document.querySelectorAll("#testTabs button").forEach(b => b.addEventListener("click", () => renderTest(+b.dataset.part)));
document.querySelectorAll("#transcriptTabs button").forEach(b => b.addEventListener("click", () => renderTranscript(+b.dataset.part)));
document.querySelectorAll("#vocabTabs button").forEach(b => b.addEventListener("click", () => renderVocab(+b.dataset.part)));

renderTest(1);
renderTranscript(1);
renderVocab(1);
updateTrackerUI();
</script>

</html>
