<style>
:root{--bg:#eef6fc;--card:#fff;--ink:#1e2b3a;--mute:#5d6b7c;--line:#d3e0ec;--acc:#0a7fc2;--hint:#0f8f7e;--ok:#d3f0e4;--okb:#3fa888;--no:#fde8d8;--nob:#e0a070;--field:#f6f9fc;

html{scroll-padding-top:env(safe-area-inset-top,0px)}

body[data-m="1"]{--acc:#1f8f80}body[data-m="2"]{--acc:#6a58c0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Be Vietnam Pro",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:20}
button,input{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);border-bottom:2px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px}
header h1{margin:0;font-size:1.15rem;color:var(--acc);font-weight:700}
.pill{border:1px solid var(--acc);border-radius:99px;padding:2px 14px;font-weight:600;font-size:.9rem;color:var(--acc);white-space:nowrap}
.bar{flex:1 1 160px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.ghost{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:6px 16px;font-size:.88rem;color:var(--mute);font-weight:600}
nav{max-width:1000px;margin:0 auto;padding:16px 16px 0}
.mods{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mod{flex:1 1 180px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:600}
.mod small{display:block;font-weight:400;color:var(--mute);font-size:.78rem}
.mod.on{background:var(--acc);border-color:var(--acc);color:#fff}.mod.on small{color:#ffffffcc}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.tab{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;font-size:.92rem;font-weight:600}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab em{font-style:normal;font-weight:400;font-size:.78rem;margin-left:6px;opacity:.75}
main{max-width:1000px;margin:0 auto;padding:8px 16px 48px}
.ttl{background:var(--acc);color:#fff;border-radius:16px;padding:16px 24px;font-size:1.35rem;font-weight:700;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 24px 24px}
.q{background:var(--field);border-left:5px solid var(--acc);border-radius:4px 12px 12px 4px;padding:14px 20px;font-weight:700;color:var(--acc);margin-bottom:18px}
.para{line-height:3;text-align:justify}
.bl{position:relative;display:inline-block;margin:0 2px}
.bl input{border:2px solid var(--line);background:var(--field);border-radius:8px;padding:2px 8px;height:38px;font-size:.95rem}
.bl.ok input{background:var(--ok);border-color:var(--okb)}
.bl.no input{background:var(--no);border-color:var(--nob)}
.hint{color:var(--hint);font-style:italic;font-weight:500;font-size:.95rem;margin:0 4px 0 2px}
.ans{display:none;position:absolute;left:0;bottom:calc(100% - 2px);width:max-content;max-width:min(320px,80vw);background:var(--ink);color:var(--bg);border-radius:8px;padding:4px 12px;font-size:.9rem;line-height:1.5;text-align:left;box-shadow:0 4px 14px #0003;z-index:5}
.bl.done:hover .ans,.bl.done:focus-within .ans{display:block}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
.note{color:var(--mute);font-size:.85rem;margin:0}
</style>
</head>

try{S=JSON.parse(localStorage.getItem("tr3"))||{}}catch(e){S={}}
function save(){try{localStorage.setItem("tr3",JSON.stringify(S))}catch(e){}}
var CM={"Well, honestly,":"Nói thật thì","To be honest,":"Thành thật mà nói","Well, actually,":"Thật ra thì","Besides,":"Bên cạnh đó","However, I sometimes":"Tuy nhiên, đôi khi tôi","However,":"Tuy nhiên","Absolutely!":"Chắc chắn rồi!","Definitely!":"Chắc chắn!","Certainly!":"Tất nhiên!","Without a doubt!":"Không nghi ngờ gì!","Not really.":"Không hẳn.","At the time,":"Vào lúc đó","Back then,":"Hồi đó","Overall, it was":"Nhìn chung, đó là","Looking back, it was":"Nhìn lại, đó là","The last time I":"Lần cuối tôi","I was particularly interested in":"Tôi đặc biệt quan tâm đến","I’m really into":"Tôi rất mê","I’m quite keen on":"Tôi khá mê","I’m a big fan of":"Tôi là fan lớn của","I’m not into":"Tôi không mê","I’m really interested in":"Tôi rất hứng thú với","It helps me":"Nó giúp tôi","It allows me to":"Nó cho phép tôi","It gives me a chance to":"Nó cho tôi cơ hội","because I wanted to":"bởi vì tôi muốn"};
var RX=new RegExp("\\[([^|\\]]+)\\|([^\\]]+)\\]|("+Object.keys(CM).sort(function(a,b){return b.length-a.length}).map(function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}).join("|")+")","g"),C={};
function parse(a,b){var key=a+"-"+b;if(C[key])return C[key];var s=D[a][b],k=s.indexOf("~"),bl=[];
var html=s.slice(k+1).replace(RX,function(_,vi,en,c){if(c){vi=CM[c];en=c}var i=bl.length;bl.push(en);
return '<span class="bl" data-i="'+i+'"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="'+vi+'" style="width:'+(en.length*.85+3)+'ch"><span class="ans">'+en+'</span></span><span class="hint">('+vi+')</span>'});
return C[key]={q:s.slice(0,k),html:html,ans:bl}}
function nb(a,b){return parse(a,b).ans.length}
function dn(a,b){var n=0;for(var i=0;i<nb(a,b);i++)if(S[a+"-"+b+"-"+i])n++;return n}
function norm(s){return s.toLowerCase().replace(/[’‘]/g,"'").replace(/n't\b/g," not").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function stats(){
var all=0,tot=0;
for(var a=0;a<3;a++){var d=0,k=0;for(var b=0;b<12;b++){d+=dn(a,b);k+=nb(a,b)}all+=d;tot+=k;
var el=document.querySelector('.mod[data-m="'+a+'"] small');if(el)el.textContent=MN[a][1]+" · "+Math.round(d/k*100)+"%"}
var p=Math.round(all/tot*100);$("pill").textContent=all+" / "+tot+" ("+p+"%)";$("bar").style.width=p+"%";
document.querySelectorAll(".tab").forEach(function(el){var b=+el.dataset.t;el.querySelector("em").textContent=dn(m,b)+"/"+nb(m,b)})}
function mark(el,r){el.classList.remove("ok","no");el.classList.add("done",r.ok?"ok":"no")}
function render(){
document.body.dataset.m=m;
$("mods").innerHTML=MN.map(function(v,i){return '<button class="mod'+(i==m?' on':'')+'" data-m="'+i+'">'+v[0]+'<small></small></button>'}).join("");
$("tabs").innerHTML=TN.map(function(v,i){return '<button class="tab'+(i==t?' on':'')+'" data-t="'+i+'">'+(i+1)+'. '+v+'<em></em></button>'}).join("");
var p=parse(m,t);
$("ttl").textContent=MN[m][0]+" · "+TN[t];
$("q").textContent="Q"+(t+1)+". "+p.q;
$("para").innerHTML=p.html;
document.querySelectorAll(".bl").forEach(function(el){var r=S[m+"-"+t+"-"+el.dataset.i];if(r){el.querySelector("input").value=r.v;mark(el,r)}});
stats()}
function answers(){return[].map.call(document.querySelectorAll(".ans"),function(x){return x.textContent})}
document.addEventListener("keydown",function(e){
if(e.key!=="Enter"||e.target.tagName!=="INPUT")return;
var el=e.target.closest(".bl"),i=+el.dataset.i,v=e.target.value.trim(),ans=answers()[i];
var r={v:v,ok:!!v&&norm(v)===norm(ans)};S[m+"-"+t+"-"+i]=r;save();mark(el,r);stats();
var all=document.querySelectorAll(".bl input"),nx=all[i+1];if(nx)nx.focus()});
document.addEventListener("click",function(e){
var el=e.target.closest("button");if(!el)return;
if(el.classList.contains("mod")){m=+el.dataset.m;render()}
else if(el.classList.contains("tab")){t=+el.dataset.t;render()}
else if(el.id==="rs"){for(var i=0;i<nb(m,t);i++)delete S[m+"-"+t+"-"+i];save();render()}
else if(el.id==="ra"){if(el.dataset.s){S={};save();render();el.textContent="Làm lại từ đầu";delete el.dataset.s}else{el.dataset.s=1;el.textContent="Bấm lần nữa để xác nhận"}}});
render();
</script>
</body>
</html>
